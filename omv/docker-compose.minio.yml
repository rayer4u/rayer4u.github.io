services:
  minio:
    image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    volumes:
      - "${data1:-./data/data1-1}:/data1"
      - "${data2:-./data/data1-2}:/data2"
      - "${data3:-./data/data2-1}:/data3"
      - "${data4:-./data/data2-2}:/data4"
    labels:
      - "traefik.enable=true"

      # 1. MinIO S3 API (端口 9000, 专属 minio entryPoint, HTTPS 绿锁, 局域网白名单 lan-only)
      - "traefik.http.routers.minio-s3.rule=Host(`minio.${DOMAIN:-roybi.net}`)"
      - "traefik.http.routers.minio-s3.entrypoints=minio"
      - "traefik.http.routers.minio-s3.tls=true"
      - "traefik.http.routers.minio-s3.middlewares=lan-only@file"
      - "traefik.http.routers.minio-s3.service=minio-s3-svc"
      - "traefik.http.services.minio-s3-svc.loadbalancer.server.port=9000"

      # 2. MinIO 控制台 Console (端口 9001, 专属 minio-console entryPoint, HTTPS 绿锁, 管理员专属 admin-ip-only)
      - "traefik.http.routers.minio-console.rule=Host(`minio.${DOMAIN:-roybi.net}`)"
      - "traefik.http.routers.minio-console.entrypoints=minio-console"
      - "traefik.http.routers.minio-console.tls=true"
      - "traefik.http.routers.minio-console.middlewares=admin-ip-only@file,security-headers@file"
      - "traefik.http.routers.minio-console.service=minio-console-svc"
      - "traefik.http.services.minio-console-svc.loadbalancer.server.port=9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # mc 原生环境变量：自动将 local 别名指向本地 MinIO
      MC_HOST_local: http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@localhost:9000
    command: server --console-address ":9001" http://minio/data{1...4}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  rclone:
    image: rclone/rclone:latest
    restart: unless-stopped
    environment:
      - RCLONE_CONFIG_LIFE_ACCESS_KEY_ID=${RCLONE_CONFIG_LIFE_ACCESS_KEY_ID}
      - RCLONE_CONFIG_LIFE_SECRET_ACCESS_KEY=${RCLONE_CONFIG_LIFE_SECRET_ACCESS_KEY}
      - RCLONE_CONFIG_MEDIA_ACCESS_KEY_ID=${RCLONE_CONFIG_MEDIA_ACCESS_KEY_ID}
      - RCLONE_CONFIG_MEDIA_SECRET_ACCESS_KEY=${RCLONE_CONFIG_MEDIA_SECRET_ACCESS_KEY}
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined
    volumes:
      - "${RCLONE_CONF_PATH:-./rclone/rclone.conf}:/root/.config/rclone/rclone.conf:ro"
      - "${RCLONE_MOUNT_DIR:-./data/minio}:/data/minio:rshared"
      - "${RCLONE_CACHE_DIR:-./data/rclone_cache}:/root/.cache/rclone"
    command:
      - "mount"
      - "${RCLONE_REMOTE_PATH:-my_minio:}"
      - "/data/minio"
      - "--allow-other"
      - "--allow-non-empty"
      - "--vfs-cache-mode=full"
      - "--vfs-cache-max-size=50G"
      - "--vfs-cache-max-age=24h"
      - "--dir-cache-time=1m"
      - "--rc"
      - "--rc-addr=:5572"
      - "--rc-no-auth"
      - "--buffer-size=32M"
      - "--vfs-read-chunk-size=16M"
      - "--vfs-read-chunk-size-limit=256M"
      - "--vfs-read-ahead=32M"
      - "--vfs-fast-fingerprint"
      - "--s3-no-check-bucket"
    healthcheck:
      test: ["CMD-SHELL", "pidof rclone > /dev/null && grep -q ' /data/minio fuse.rclone ' /proc/mounts || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      minio:
        condition: service_healthy