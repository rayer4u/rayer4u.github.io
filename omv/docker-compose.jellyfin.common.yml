services:
  jellyfin-common:
    image: jellyfin/jellyfin:12.0
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |
        echo "[Jellyfin 挂载检查] 检查媒体库目录是否已完成 Rclone 挂载..."
        if [ ! -d "/media" ] || [ -z "$$(ls -A /media 2>/dev/null)" ]; then
          echo "[Jellyfin 挂载检查] 目录为空（Rclone 尚未挂载好），退出容器等待 Docker 自动重试..."
          sleep 5
          exit 1
        fi
        echo "[Jellyfin 挂载检查] 挂载就绪，正常启动 Jellyfin 主进程！"
        exec /jellyfin/jellyfin "$$@"
    volumes:
      - "${JELLYFIN_DATA_DIR:-./data/jellyfin}/config:/config"
      - "${JELLYFIN_DATA_DIR:-./data/jellyfin}/cache:/cache"
      - "${JELLYFIN_MEDIA_DIR:-./data/minio/jellyfin}:/media:rslave"
    expose:
      - "8096"
    labels:
      - "traefik.enable=true"
      # Jellyfin 路由 (统一经由 https://media.${DOMAIN} 访问，主域名由 Seafile 占用，8920 端口请求自动重定向至此)
      - "traefik.http.routers.jellyfin.rule=Host(`${JELLYFIN_HOST:-media.${DOMAIN}}`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.middlewares=jellyfin-headers@file,compress@file"
      - "traefik.http.routers.jellyfin.tls=true"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
    depends_on:
      rclone:
        condition: service_healthy
