services:
  photo:
    extends:
      file: docker-compose.photo.common.yml
      service: photo-common
    environment:
      PHOTOPRISM_FFMPEG_ENCODER: "nvidia"
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "all"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
