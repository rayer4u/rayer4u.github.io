global:
  checkNewVersion: false

  sendAnonymousUsage: false

log:
  level: INFO

accessLog: {}

api:
  dashboard: true
  insecure: false

entryPoints:
  traefik:
    http:
      aliasHeadersStrategy: delete

  web:
    address: ":80"
    http:
      aliasHeadersStrategy: delete
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http3: {}
    http:
      aliasHeadersStrategy: delete
      tls: {}

  jellyfin:
    address: ":8920"
    http3: {}
    http:
      aliasHeadersStrategy: delete

  minio:
    address: ":9000"
    http:
      aliasHeadersStrategy: delete

  minio-console:
    address: ":9001"
    http:
      aliasHeadersStrategy: delete


providers:
  docker:
    endpoint: "tcp://docker-proxy:2375"
    exposedByDefault: false
  file:
    directory: "/etc/traefik/dynamic"
    watch: true


