http:
  routers:
    # 1. Traefik Dashboard 管理面板路由 (受局域网白名单与 BasicAuth 双重保护)
    dashboard:
      rule: "Host(`traefik.{{ env "DOMAIN" }}`)"
      entryPoints:
        - "websecure"
      service: "api@internal"
      tls: {}
      middlewares:
        - "lan-only@file"
        - "dashboard-auth@file"
        - "security-headers@file"

    # 2. 泛域名证书申请路由器 (触发申请 *.${DOMAIN} 与 ${DOMAIN} 泛域名证书，不拦截业务域名)
    wildcard-certs:
      rule: "Host(`acme.{{ env "DOMAIN" }}`)"
      entryPoints:
        - "websecure"
      service: "noop@internal"
      tls:
        certResolver: "myresolver"
        domains:
          - main: "{{ env "DOMAIN" }}"
            sans:
              - "*.{{ env "DOMAIN" }}"

    # 3. 8920 历史端口精确 301 重定向到 Jellyfin 业务域名
    jellyfin-8920:
      rule: "HostRegexp(`^.+$`)"
      entryPoints:
        - "jellyfin"
      service: "noop@internal"
      tls: {}
      middlewares:
        - "redirect-to-jellyfin"

  middlewares:
    # 8920 端口专用重定向中间件 (就地与 jellyfin-8920 路由绑定维护)
    redirect-to-jellyfin:
      redirectRegex:
        regex: "^https?://[^/]+(:\\d+)?/(.*)$"
        replacement: "https://{{ env "JELLYFIN_HOST" }}:{{ env "TRAEFIK_HTTPS_PORT" }}/${2}"
        permanent: true
