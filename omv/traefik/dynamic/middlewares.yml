http:
  middlewares:
    # Gzip / Brotli 压缩
    compress:
      compress: {}

    # 常用安全请求头
    security-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: SAMEORIGIN

    # Jellyfin 专属安全请求头 (移植自 nginx/jellyfin.conf)
    jellyfin-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: SAMEORIGIN
        permissionsPolicy: "accelerometer=(), ambient-light-sensor=(), battery=(), bluetooth=(), camera=(), clipboard-read=(), display-capture=(), document-domain=(), encrypted-media=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), interest-cohort=(), keyboard-map=(), local-fonts=(), magnetometer=(), microphone=(), payment=(), publickey-credentials-get=(), serial=(), sync-xhr=(), usb=(), xr-spatial-tracking=()"
        contentSecurityPolicy: "default-src https: data: blob: ; img-src 'self' https://* ; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://www.youtube.com blob:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'self'; font-src 'self'"

    # Traefik Dashboard BasicAuth 认证中间件
    # 默认用户名为 admin，密码可通过 htpasswd 生成替换
    # 例如: echo $(htpasswd -nb admin 123456) | sed -e s/\\$/\\$\\$/g
    dashboard-auth:
      basicAuth:
        users:
          - "admin:$$apr1$$ruca84Hq$$mbjdMZBAG.KWn7vfN/SNK/" # 默认密码: admin123

    # 局域网白名单限制中间件 (仅允许私有 IP 网段与本地回环，公网请求拒绝 403)
    lan-only:
      ipAllowList:
        sourceRange:
          - "127.0.0.1/32"       # 本机回环
          - "10.0.0.0/8"          # RFC 1918 私网 A 类
          - "172.16.0.0/12"       # RFC 1918 私网 B 类 (包含 Docker 容器网络)
          - "192.168.0.0/16"      # RFC 1918 私网 C 类 (家庭/办公局域网)
          - "::1/128"             # IPv6 回环
          - "fc00::/7"            # IPv6 唯一本地地址 (ULA)
          - "fe80::/10"           # IPv6 链路本地地址 (Link-local)
