services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - NETWORKS=1
      - EVENTS=1
      - PING=1
      - VERSION=1
    networks:
      - docker-proxy

  traefik:
    image: traefik:v3.7.12
    restart: unless-stopped
    depends_on:
      - docker-proxy
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
      - "${TRAEFIK_HTTPS_PORT:-443}:443/udp"
      - "${JELLYFIN_HTTPS_PORT:-8920}:8920"
      - "${JELLYFIN_HTTPS_PORT:-8920}:8920/udp"
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
      # Dashboard 已收敛至 HTTPS 域名 (https://traefik.${DOMAIN}) 并受 BasicAuth 保护，不再开放未鉴权的 8080 端口
      # - "127.0.0.1:${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ${HOST_CERT_DIR:-./certs}:/etc/traefik/certs:ro
    environment:
      - DOMAIN=${DOMAIN}
      - TZ=${TIME_ZONE:-Asia/Shanghai}

      # 动态配置环境变量
      - JELLYFIN_HOST=${JELLYFIN_HOST:-media.${DOMAIN}}
      - TRAEFIK_HTTPS_PORT=${TRAEFIK_HTTPS_PORT:-443}
    networks:
      - default
      - docker-proxy

networks:
  docker-proxy:
    internal: true







