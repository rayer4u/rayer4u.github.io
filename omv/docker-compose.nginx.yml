services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${NGINX_DATA_DIR:-./data/nginx}/passwd:/opt/passwd:ro
      - ${HTML_DATA_DIR:-./data/html}:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      # Nginx 静态文件浏览路由 (https://files.${DOMAIN})
      - "traefik.http.routers.nginx.rule=Host(`${FILES_HOST:-files.${DOMAIN}}`)"
      - "traefik.http.routers.nginx.entrypoints=websecure"
      - "traefik.http.routers.nginx.tls=true"
      - "traefik.http.routers.nginx.middlewares=lan-only@file"
      - "traefik.http.services.nginx.loadbalancer.server.port=80"



