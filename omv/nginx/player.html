<!-- Autoindex 4小时安全免密直链复制组件 -->
<style>
  .play-btn-group {
    display: inline-block;
    margin-left: 10px;
    font-size: 11px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    vertical-align: middle;
  }
  .play-btn-copy {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 3px;
    background-color: #2980b9;
    color: #ffffff !important;
    line-height: 1.4;
    cursor: pointer;
    border: none;
    font-size: 11px;
    font-weight: 500;
    text-decoration: none;
    transition: background-color 0.2s ease, opacity 0.15s ease, transform 0.05s ease;
  }
  .play-btn-copy:hover {
    background-color: #3498db;
    opacity: 0.9;
  }
  .play-btn-copy:active {
    transform: scale(0.96);
  }
  .play-btn-copy[disabled] {
    opacity: 0.6;
    cursor: not-allowed;
  }
  .play-btn-copy.copied {
    background-color: #27ae60;
  }
</style>

<script>
(function() {
    var videoExts = /\.(mp4|mkv|webm|avi|mov|ts|flv|m4v|iso|rmvb|wmv)$/i;
    var signCache = {};

    function fetchSecureUrl(targetHref) {
        var u = new URL(targetHref, window.location.href);
        var uri = u.pathname;
        if (signCache[uri]) {
            return Promise.resolve(signCache[uri]);
        }
        return fetch("/api/sign?uri=" + encodeURIComponent(uri), {
            credentials: "include"
        }).then(function(res) {
            if (!res.ok) {
                throw new Error("HTTP " + res.status);
            }
            return res.json();
        }).then(function(data) {
            var fullUrl = new URL(data.url, window.location.origin).href;
            signCache[uri] = fullUrl;
            return fullUrl;
        });
    }

    function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(text);
        }
        return new Promise(function(resolve, reject) {
            try {
                var textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.top = "-9999px";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                var successful = document.execCommand('copy');
                document.body.removeChild(textArea);
                if (successful) {
                    resolve();
                } else {
                    reject(new Error("execCommand failed"));
                }
            } catch (err) {
                reject(err);
            }
        });
    }

    function init() {
        var links = document.querySelectorAll("pre a, a");
        links.forEach(function(a) {
            var href = a.getAttribute("href");
            if (!href || href === "../" || !videoExts.test(href)) {
                return;
            }

            var group = document.createElement("span");
            group.className = "play-btn-group";

            var copyBtn = document.createElement("button");
            copyBtn.className = "play-btn-copy";
            copyBtn.textContent = "📋 复制直链";
            copyBtn.title = "复制 4 小时有效免密拉流直链，可直接在 MX Player 的【网络串流】中粘贴播放";

            copyBtn.onclick = function(e) {
                e.preventDefault();
                var originText = copyBtn.textContent;
                copyBtn.disabled = true;
                copyBtn.textContent = "⏳...";

                fetchSecureUrl(href).then(function(safeUrl) {
                    return copyToClipboard(safeUrl).then(function() {
                        copyBtn.classList.add("copied");
                        copyBtn.textContent = "✔ 已复制(4h)";
                        setTimeout(function() {
                            copyBtn.classList.remove("copied");
                            copyBtn.textContent = originText;
                            copyBtn.disabled = false;
                        }, 2000);
                    }).catch(function() {
                        copyBtn.disabled = false;
                        copyBtn.textContent = originText;
                        prompt("请手动复制 4 小时免密播放直链：", safeUrl);
                    });
                }).catch(function(err) {
                    copyBtn.disabled = false;
                    copyBtn.textContent = originText;
                    alert("生成免密拉流地址失败: " + err.message);
                });
            };

            group.appendChild(copyBtn);
            a.parentNode.insertBefore(group, a.nextSibling);
        });
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
    } else {
        init();
    }
})();
</script>
