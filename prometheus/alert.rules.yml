groups:
  - name: example_alert_rules
    rules:
      - alert: TargetDown
        expr: probe_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Target {{ $labels.instance }} is down"
          description: "The target {{ $labels.instance }} has been down for more than 5 minutes."
  - name: ssl_expiry_rules
    rules:
    - alert: SSLCertExpiringSoon
      expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 5
      for: 720m
      labels:
        severity: warning
      annotations:
        summary: "Certificate for {{ $labels.instance }} expires in {{ $value }} days"